name: sreyhan_diary
description: "A playful travel diary that helps a child talk about their photos in English."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  google_mlkit_translation: ^0.15.1
  http: ^1.6.0
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/fonts/OFL.txt
  # Baloo 2 (SIL Open Font License 1.1, assets/fonts/OFL.txt), subset to Latin.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
