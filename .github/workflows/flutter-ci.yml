name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checks and builds every push; publishing is release.yml's job (a vX.Y.Z tag).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The NDK download from Google sometimes arrives cut short ("unknown
      # archive"), failing the build; fetch it first, retrying.
      - name: Install the Android NDK
        run: |
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" < /dev/null > /dev/null && exit 0
            echo "NDK download failed (try $i), retrying"; sleep 15
          done
          exit 1

      # The phone can't build APKs itself (the Android build tools are x86
      # only), so this checks that the app builds. A release build (ahead-of-
      # time compiled, unused code and icons stripped, arm64 only) is a
      # fraction of a debug build's size. The APK is kept as a download for
      # two weeks, but nothing reaches the phone until a release (release.yml).
      - name: Build the APK
        run: |
          # The same number release.yml gives this version (see there).
          BUILD_NUMBER=$(python3 tool/build_number.py)
          # No --split-debug-info: crash notes then name the functions involved.
          flutter build apk --release --target-platform android-arm64 --build-number=$BUILD_NUMBER
          cp build/app/outputs/flutter-apk/app-release.apk SreyhanDiary.apk
          ls -l SreyhanDiary.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SreyhanDiary-${{ github.sha }}
          path: SreyhanDiary.apk
          retention-days: 14
