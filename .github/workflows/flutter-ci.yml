name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Publishing the APK to the Releases page needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The NDK download from Google sometimes arrives cut short ("unknown
      # archive"), failing the build; fetch it first, retrying.
      - name: Install the Android NDK
        run: |
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" < /dev/null > /dev/null && exit 0
            echo "NDK download failed (try $i), retrying"; sleep 15
          done
          exit 1

      # The phone can't build APKs itself (the Android build tools are x86
      # only), so this is where the installable APK comes from.
      - run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: SreyhanDiary-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Every build on main replaces the "latest" release, so this link always
      # gets the newest APK:
      # https://github.com/<owner>/SreyhanTravelDiary/releases/latest/download/SreyhanDiary.apk
      - name: Publish to Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk SreyhanDiary.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SreyhanDiary.apk \
            --target "$GITHUB_SHA" \
            --title "Sreyhan's Diary (newest build)" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
