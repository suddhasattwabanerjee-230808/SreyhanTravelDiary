name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Publishing the APK to the Releases page needs write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # The NDK download from Google sometimes arrives cut short ("unknown
      # archive"), failing the build; fetch it first, retrying.
      - name: Install the Android NDK
        run: |
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" < /dev/null > /dev/null && exit 0
            echo "NDK download failed (try $i), retrying"; sleep 15
          done
          exit 1

      # The phone can't build APKs itself (the Android build tools are x86
      # only), so this is where the installable APK comes from. A release
      # build (ahead-of-time compiled, unused code and icons stripped, arm64
      # only) is a fraction of a debug build's size. Every build gets its own
      # number, so the app's updater can tell a newer one apart.
      - name: Build the APK
        run: |
          echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')" >> "$GITHUB_ENV"
          # No --split-debug-info: crash notes then name the functions involved.
          flutter build apk --release --target-platform android-arm64 \
            --build-number=$((100 + GITHUB_RUN_NUMBER))
          cp build/app/outputs/flutter-apk/app-release.apk SreyhanDiary.apk
          ls -l SreyhanDiary.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SreyhanDiary-${{ github.sha }}
          path: SreyhanDiary.apk
          retention-days: 14

      # Every build on main replaces this repo's "latest" release, so this link
      # always gets the newest APK:
      # https://github.com/<owner>/SreyhanTravelDiary/releases/latest/download/SreyhanDiary.apk
      - name: Publish to Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest SreyhanDiary.apk \
            --target "$GITHUB_SHA" \
            --title "Sreyhan's Diary $VERSION_NAME ($BUILD_NUMBER)" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"

      # The app checks the public SreyhanTravelDiary-releases repo for updates
      # (lib/updates.dart): it holds only APKs and latest.json, since this repo
      # is private. RELEASES_TOKEN is a token that can write to that repo; without
      # it this step only warns.
      - name: Publish the in-app update
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Set the RELEASES_TOKEN secret to publish in-app updates."
            exit 0
          fi
          python3 - > latest.json <<'PY'
          import json, os, subprocess
          notes = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          print(json.dumps({"versionCode": int(os.environ["BUILD_NUMBER"]),
                            "versionName": os.environ["VERSION_NAME"], "notes": notes}))
          PY
          gh release create "v$VERSION_NAME-$BUILD_NUMBER" SreyhanDiary.apk latest.json \
            --repo suddhasattwabanerjee-230808/SreyhanTravelDiary-releases \
            --title "Sreyhan's Diary $VERSION_NAME ($BUILD_NUMBER)" \
            --notes "$(git log -1 --format=%s)" --latest
